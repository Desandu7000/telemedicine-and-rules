<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20444C"/>
      <stop offset="100%" stop-color="#3C6E71"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8DAF83"/>
      <stop offset="100%" stop-color="#739B68"/>
    </linearGradient>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#brandGrad)" />
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="#FAF7F0" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Signal Radar Waves (Telemedicine Connection) -->
  <path d="M14 20 A 24 24 0 0 1 50 20" fill="none" stroke="#FAF7F0" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.4" />
  <path d="M20 25 A 16 16 0 0 1 44 25" fill="none" stroke="#FAF7F0" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Medical Cross Symbol -->
  <rect x="27" y="28" width="10" height="26" rx="3" fill="url(#crossGrad)" />
  <rect x="19" y="36" width="26" height="10" rx="3" fill="url(#crossGrad)" />

  <!-- Center Pulse Dot -->
  <circle cx="32" cy="41" r="3.5" fill="#FAF7F0" />
</svg>
